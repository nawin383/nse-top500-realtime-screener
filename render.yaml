services:
  - type: web
    name: nse-top500-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      echo "Python $(python --version) pip $(pip --version)" &&
      pip install --upgrade pip &&
      pip install --no-cache-dir -r requirements.txt &&
      echo "Backend deps installed OK" &&
      if command -v npm >/dev/null 2>&1; then
        echo "npm $(npm --version) found, building frontend" &&
        cd frontend && npm ci && npm run build && cd ..;
      else
        echo "npm not found, installing Node 18" &&
        curl -fsSL https://deb.nodesource.com/setup_18.x | bash - &&
        apt-get install -y nodejs &&
        cd frontend && npm ci && npm run build && cd ..;
      fi &&
      echo "Build complete" && ls -lh frontend/dist || echo "No frontend/dist yet"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: mock
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://nse-top500-realtime-screener-1.onrender.com,https://nse-top500-realtime-screener.vercel.app
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
