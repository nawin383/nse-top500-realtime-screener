services:
  - type: web
    name: nse-top500-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATA_MODE
        value: mock
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false  # set to your Vercel URL e.g. https://nse-top500-realtime-screener.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: KITE_API_KEY
        sync: false
      - key: KITE_ACCESS_TOKEN
        sync: false
