apiVersion: apps/v1
kind: Deployment
metadata:
  name: nse-backend
  labels: { app: nse-backend }
spec:
  replicas: 3
  selector: { matchLabels: { app: nse-backend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: nse-backend } }
    spec:
      containers:
        - name: backend
          image: ghcr.io/nse-top500/screener-backend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DATA_MODE, value: "mock" }
            - { name: REDIS_ENABLED, value: "true" }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: nse-secrets, key: redis-url } }
            - name: KITE_API_KEY
              valueFrom: { secretKeyRef: { name: nse-secrets, key: kite-api-key, optional: true } }
          envFrom: [{ configMapRef: { name: nse-config } }]
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            failureThreshold: 12
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nse-frontend
  labels: { app: nse-frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: nse-frontend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: nse-frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nse-top500/screener-frontend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
