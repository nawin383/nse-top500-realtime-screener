services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck: { test: ["CMD-SHELL","curl -f http://localhost:9200/_cluster/health || exit 1"], interval: 10s, retries: 10 }
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    volumes: ["./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    ports: ["5044:5044"]
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    environment: { ELASTICSEARCH_HOSTS: "http://elasticsearch:9200" }
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    volumes: ["/var/lib/docker/containers:/var/lib/docker/containers:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"]
    depends_on: [logstash]
volumes: { esdata: {} }
