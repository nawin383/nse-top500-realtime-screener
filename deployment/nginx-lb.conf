upstream backend_pool {
    least_conn;
    server backend-1:8000 max_fails=3 fail_timeout=15s;
    server backend-2:8000 max_fails=3 fail_timeout=15s;
    server backend-3:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/ws(/.*)?$ {
        limit_req zone=ws burst=20 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /health { proxy_pass http://backend_pool/api/health; access_log off; }
}
