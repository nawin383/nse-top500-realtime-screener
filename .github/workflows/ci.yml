name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - name: Install Python deps
        run: pip install -r requirements.txt && pip install pytest-cov
      - name: pytest
        run: python -m pytest backend/tests -v --cov=backend/app

      - uses: actions/setup-node@v4
        with: { node-version: '18', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Install & build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Snyk security scan (placeholder)
        uses: snyk/actions/python@master
        continue-on-error: true
        env: { SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} }
        with: { args: --severity-threshold=high }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
